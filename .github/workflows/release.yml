name: Release

# Builds Safespace.dmg (macOS) and Safespace-Setup.exe (Windows) and publishes them as a GitHub
# release. Either push a tag like v1.1.0, or run it from the Actions tab ("Run workflow"), which
# tags the selected commit with the version in windows/src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          tag="v$(jq -r .version windows/src-tauri/tauri.conf.json)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "tauri.conf.json says $tag but the pushed tag is $GITHUB_REF_NAME"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS DMG
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift build --build-tests && swift test --skip-build

      - name: Build app
        run: SAFESPACE_VERSION="${TAG#v}" scripts/build-app.sh
        env:
          TAG: ${{ needs.version.outputs.tag }}

      - name: Build DMG
        run: scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/Safespace.dmg

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - run: npm ci
      - run: npm test

      - name: Build installer
        run: npx tauri build

      - name: Collect
        shell: bash
        run: |
          mkdir -p ../dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe ../dist/Safespace-Setup.exe
          cp src-tauri/target/release/safespace.exe ../dist/Safespace-Portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  release:
    name: Publish release
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Safespace ${{ needs.version.outputs.tag }}
          make_latest: true
          files: |
            dist/Safespace.dmg
            dist/Safespace-Setup.exe
            dist/Safespace-Portable.exe
          body: |
            ## Downloads

            | | |
            | --- | --- |
            | **macOS 14+** | **Safespace.dmg** — open it and drag Safespace into Applications |
            | **Windows 10/11** | **Safespace-Setup.exe** — installs for your user, no admin needed |
            | Windows, no install | Safespace-Portable.exe — needs the WebView2 runtime (built into Windows 11) |

            Both apps read and write the same encrypted vault file, `vault.dat`, so you can copy it
            between a Mac and a PC.

            Neither build is code-signed by a paid certificate yet. On macOS right-click the app and choose
            **Open** the first time. On Windows, SmartScreen may say "Windows protected your PC": click
            **More info → Run anyway**.

            ## What's new in 1.3

            Opens vaults from the **original SafeSpace** (the earlier C++ app for Windows), on both
            Windows and macOS:

            - On a PC where the original app was used, its `vault.dat` sits where Safespace looks for
              it. Unlock with your old master password: the vault is converted to the current format
              with the same password, and the original file is kept as `vault.dat.classic`.
            - On a Mac or a new PC, choose **Open an existing vault file…** on the first-run screen, or
              **Settings → General → Import logins** to merge it into an existing vault.
            - Categories become groups. Titles, usernames, passwords, notes and dates carry over.

            ## 1.2.1

            Fixes for "my password isn't accepted" on Windows:

            - If the password doesn't open `vault.dat` but opens the backup (`vault.dat.bak`, or a
              `vault.safespace` left by 1.1), Safespace restores that copy and tells you. The file that
              didn't open is kept as `vault.dat.unreadable-…`, never deleted.
            - Passwords with accented letters (ü, é, ß…) are accepted however the keyboard encodes them.
            - The lock screen warns when Caps Lock is on, and a wrong password hints at the keyboard layout.
            - Fixed a rare case where saving a login while changing the master password could write the
              vault with the old password.

            ## 1.2

            - The vault is now stored as `vault.dat`. Updating from 1.1 needs nothing: the old
              `vault.safespace` is renamed automatically on first launch.
            - **Open an existing vault file…** on the first-run screen uses a vault from a backup or another
              computer.
            - **Settings → General → Import logins** merges another vault file into yours (with that file's
              password). Logins you already have are kept and nothing is duplicated.
